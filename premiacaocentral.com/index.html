<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Promoção Premiada — Verificação</title>
    <meta name="description" content="Verifique se seu perfil foi selecionado para a promoção premiada."/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        page: '#fafafa', 
                        card: '#ffffff',
                        brand: {
                            DEFAULT: '#e62429', // Red color that matches the screenshot
                            hover: '#c81d22',
                        },
                        border: '#e5e7eb',
                        background: '#ffffff',
                        foreground: '#111827',
                        muted: {
                            foreground: '#6b7280'
                        }
                    },
                    boxShadow: {
                        soft: '0 4px 20px -2px rgba(0,0,0,0.05)',
                        brand: '0 4px 14px 0 rgba(230, 36, 41, 0.39)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: theme('colors.page');
            color: theme('colors.foreground');
        }
    </style>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1520663849512203');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1520663849512203&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
    <!-- UTMify -->
    <script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>
</head>
<body>
<div class="min-h-screen flex flex-col">
    <div class="h-1.5 w-full bg-brand"></div>
    <main class="flex-1 flex items-start sm:items-center justify-center px-4 py-10 sm:py-16">
        <div class="w-full max-w-xl">
            <div class="bg-card rounded-xl shadow-soft border border-border p-8 text-center">
                <div class="mx-auto w-16 h-16 rounded-full bg-brand flex items-center justify-center shadow-brand">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-white" aria-hidden="true">
                        <path d="M12 7v14"></path>
                        <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"></path>
                        <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"></path>
                        <rect x="3" y="7" width="18" height="4" rx="1"></rect>
                    </svg>
                </div>
                <p class="mt-3 text-muted-foreground font-medium text-[15px]">Antes de continuar, informe seu nome para personalizarmos sua experiência.</p>
                <form id="nomeForm" class="mt-6 space-y-3">
                    <input type="text" id="nomeInput" placeholder="Digite seu nome" class="w-full rounded-lg border border-border bg-background px-4 py-3 text-foreground outline-none focus:ring-2 focus:ring-brand" autofocus/>
                    <button type="submit" id="submitBtn" disabled class="w-full rounded-lg bg-brand hover:bg-brand-hover text-white font-extrabold uppercase tracking-wide py-4 px-6 shadow-brand transition-transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">Continuar</button>
                </form>
            </div>
        </div>
    </main>
</div>

<script>
    const input = document.getElementById('nomeInput');
    const btn = document.getElementById('submitBtn');

    input.addEventListener('input', (e) => {
        if (e.target.value.trim().length > 0) {
            btn.removeAttribute('disabled');
        } else {
            btn.setAttribute('disabled', 'true');
        }
    });

    document.getElementById('nomeForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const nome = input.value.trim();
        if (nome) {
            // Salva o nome para usar na próxima página se necessário
            localStorage.setItem('userName', nome);
            
            // Redireciona para a próxima etapa repassando as UTMs da URL atual
            window.location.href = 'verificacao.html' + window.location.search;
        }
    });
</script>
</body>
</html>
