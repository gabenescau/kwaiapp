    <style>
        /* ===== CSS VARIABLES (extraídas do styles-L1BozSOK.css original) ===== */
        :root {
            --radius: 0.625rem;
            --background: oklch(100% 0 0);
            --foreground: oklch(12.9% .042 264.695);
            --card: oklch(100% 0 0);
            --muted: oklch(96.8% .007 247.896);
            --muted-foreground: oklch(55.4% .046 257.417);
            --border: oklch(92.9% .013 255.508);
            --chat: oklch(91% .02 90);
            --wa-header: oklch(38% .06 165);
            --wa-in: oklch(100% 0 0);
            --wa-out: oklch(92% .08 145);
            --wa-input: oklch(96% .01 90);
            --wa-system: oklch(95% .05 145);
            --wa-system-foreground: oklch(35% .06 165);
            --color-sky-500: oklch(68.5% .169 237.323);
            --color-green-500: oklch(72.3% .219 149.579);
            --color-green-600: oklch(62.7% .194 149.214);
        }

        /* ===== RESET ===== */
        *, *::before, *::after { box-sizing: border-box; border: 0 solid; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; line-height: 1.5; font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; -webkit-tap-highlight-color: transparent; }
        img, video { max-width: 100%; height: auto; display: block; }
        button, input, select, textarea { font: inherit; color: inherit; background-color: transparent; border-radius: 0; opacity: 1; }
        [hidden] { display: none !important; }

        /* ===== LAYOUT BASE ===== */
        body {
            background-color: var(--background);
            color: var(--foreground);
        }

        .fixed { position: fixed; }
        .inset-0 { inset: 0; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .overflow-hidden { overflow: hidden; }

        /* ===== CHAT BG (exato do original) ===== */
        .chat-bg {
            background-color: var(--chat);
            background-image: url('images/chat-bg.jpg');
            background-repeat: repeat;
            background-size: auto;
        }

        /* ===== HEADER ===== */
        .wa-header {
            background-color: var(--wa-header);
            color: #fff;
            padding: 0.5rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
            z-index: 10;
            flex-shrink: 0;
        }
        .wa-header .avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .wa-header .info { flex: 1; min-width: 0; }
        .wa-header .name-row {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .wa-header .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .wa-header .status {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
            font-style: italic;
        }
        .wa-header .icons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .wa-header .icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
        .wa-header .back-icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

        /* ===== CHAT SCROLL AREA ===== */
        .chat-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 1rem 0.75rem;
        }
        .chat-inner {
            max-width: 42rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* ===== SYSTEM MESSAGE ===== */
        .system-msg {
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
        }
        .system-msg-inner {
            background-color: var(--wa-system);
            color: var(--wa-system-foreground);
            font-size: 0.75rem;
            border-radius: calc(var(--radius) - 2px);
            padding: 0.375rem 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        /* ===== BOT MESSAGE ===== */
        .msg-bot-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            gap: 0.375rem;
        }
        .msg-avatar {
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 9999px;
            object-fit: cover;
            flex-shrink: 0;
            margin-bottom: 0.25rem;
        }
        .msg-bot-bubble {
            max-width: 78%;
            background-color: var(--wa-in);
            color: var(--foreground);
            border-radius: var(--radius);
            border-bottom-left-radius: calc(var(--radius) - 4px);
            padding: 0.5rem 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1);
        }
        .msg-bot-bubble.video-bubble {
            max-width: 92%;
            width: 92%;
        }
        .msg-text {
            font-size: 0.875rem;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .msg-time {
            font-size: 10px;
            color: var(--muted-foreground);
            text-align: right;
            margin-top: 0.125rem;
            line-height: 1;
        }

        /* ===== AUDIO MESSAGE ===== */
        .msg-bot-bubble audio {
            max-width: 100%;
            width: 100%;
        }

        /* ===== CUSTOM AUDIO PLAYER ===== */
        .custom-audio-player {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 250px;
        }
        .audio-play-btn {
            width: 2.5rem;
            height: 2.5rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .audio-play-btn svg {
            width: 1.75rem;
            height: 1.75rem;
            fill: #000;
        }
        .audio-waveform-container {
            flex: 1;
            position: relative;
            height: 2.5rem;
            display: flex;
            align-items: center;
        }
        .waveform-bg, .waveform-active {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            gap: 2px;
            overflow: hidden;
        }
        .waveform-bg {
            width: 100%;
        }
        .waveform-active {
            width: 0%;
            z-index: 1;
        }
        .waveform-bars-wrapper {
            display: flex;
            align-items: center;
            gap: 2px;
            width: 160px;
        }
        .wave-bar {
            width: 3px;
            border-radius: 9999px;
            flex-shrink: 0;
        }
        .wave-bar.bg { background-color: var(--border); }
        .wave-bar.active { background-color: var(--color-sky-500); }
        
        .progress-dot {
            position: absolute;
            width: 0.875rem;
            height: 0.875rem;
            background-color: var(--color-sky-500);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            left: 0%;
            pointer-events: none;
            z-index: 2;
            transition: left 0.05s linear;
        }
        .audio-seek-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
        }
        .audio-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-left: 3.25rem;
            margin-top: -0.25rem;
            margin-bottom: -0.25rem;
        }
        .audio-duration {
            font-size: 11px;
            color: var(--muted-foreground);
        }

        /* ===== USER MESSAGE ===== */
        .msg-user-row {
            display: flex;
            justify-content: flex-end;
        }
        .msg-user-bubble {
            max-width: 80%;
            background-color: var(--wa-out);
            color: var(--foreground);
            border-radius: var(--radius);
            border-top-right-radius: calc(var(--radius) - 4px);
            padding: 0.5rem 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1);
        }
        .msg-user-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.25rem;
            margin-top: 0.125rem;
            line-height: 1;
        }

        /* ===== TYPING INDICATOR (bounce exato do original) ===== */
        .typing-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            gap: 0.375rem;
        }
        .typing-bubble {
            background-color: var(--wa-in);
            border-radius: var(--radius);
            border-bottom-left-radius: calc(var(--radius) - 4px);
            padding: 0.75rem 1rem;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .typing-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 9999px;
            background-color: var(--muted-foreground);
            opacity: 0.6;
            animation: bounce 1s infinite;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.3s; }
        .typing-dot:nth-child(2) { animation-delay: -0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,.2,1); }
        }

        /* ===== OPTION BUTTONS ===== */
        .options-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            padding-top: 0.5rem;
        }
        .option-btn {
            background-color: var(--wa-out);
            color: var(--foreground);
            border-radius: calc(var(--radius) + 8px);
            border-top-right-radius: calc(var(--radius) - 4px);
            padding: 0.5rem 1rem;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,.1);
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid;
            border-color: color-mix(in oklab, var(--wa-header) 20%, transparent);
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }
        .option-btn:hover { background-color: color-mix(in oklab, var(--wa-out) 80%, transparent); }
        .option-btn:active { transform: scale(0.95); }

        /* ===== CTA FINAL ===== */
        .cta-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding-top: 1rem;
            padding-bottom: 0.5rem;
        }
        .cta-audio { width: 100%; max-width: 28rem; }
        .cta-btn {
            display: block;
            width: 100%;
            max-width: 28rem;
            text-align: center;
            background-color: var(--color-green-500);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            padding: 1rem 1.5rem;
            border-radius: calc(var(--radius) + 4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
            text-decoration: none;
            transition: background-color 0.15s, transform 0.1s;
            animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite;
            cursor: pointer;
        }
        .cta-btn:hover { background-color: var(--color-green-600); }
        .cta-btn:active { transform: scale(0.95); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* ===== VIDEO ===== */
        .video-wrapper { position: relative; padding: 56.25% 0 0 0; margin: 0 auto; width: 100%; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* ===== FOOTER FORM ===== */
        .wa-footer {
            background-color: var(--wa-input);
            padding: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        }
        .wa-input-field {
            flex: 1;
            background-color: var(--card);
            border-radius: 9999px;
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
            outline: none;
            opacity: 0.6;
            cursor: default;
        }
        .wa-send-btn {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 9999px;
            background-color: var(--wa-header);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            cursor: default;
            border: none;
        }

        /* ===== VERIFIED BADGE ===== */
        .verified-badge { width: 1rem; height: 1rem; flex-shrink: 0; }

        /* ===== CHECK ICON (double tick azul) ===== */
        .check-icon { width: 0.875rem; height: 0.875rem; color: var(--color-sky-500); fill: none; }

        /* ===== FADE IN ANIMATION ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-bot-row, .msg-user-row, .typing-row {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>

            'Estamos validando sua participação em nosso questionário... ⏳',

];

const FINAL_MSGS = [
    'Parabéns você completou todas as perguntas com sucesso! 😍',
    'Clique no botão abaixo para realizar o seu saque',
    'audio:sounds/audio-taxa.opus'
];

// ===== HELPERS =====
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function getTime() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function getTodayString() {
    return new Date().toLocaleDateString('pt-BR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
}

function replaceVars(text) {
    return text
        .replace(/\{name\}/g, userName)
        .replace(/\{today\}/g, getTodayString());
}

function scrollToBottom() {
    chatScroll.scrollTo({ top: chatScroll.scrollHeight, behavior: 'smooth' });
}

// ===== SOUND =====
function playMessageSound() {
    try {
        const snd = document.getElementById('snd-message');
        if (snd) {
            snd.currentTime = 0;
            snd.volume = 0.7;
            snd.play().catch(() => {});
        }
    } catch(e) {}
}

// ===== AVATAR IMG TAG =====
function avatarImg(cls) {
    return `<img src="${AVATAR_SRC}" alt="Julia" width="28" height="28" loading="eager" class="${cls}" onerror="this.src='${AVATAR_FALLBACK}'"/>`;
}

// ===== TYPING INDICATOR =====
let typingEl = null;
function showTyping(audioMode) {
    removeTyping();
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing-indicator';
    row.innerHTML = `
        ${avatarImg('msg-avatar')}
        <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    `;
    chatInner.appendChild(row);
    typingEl = row;
    scrollToBottom();
    // Status
    statusText.textContent = audioMode ? 'gravando áudio...' : 'digitando...';
}

function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
}

// ===== BOT MESSAGE =====
function appendBotMessage(text) {
    const time = getTime();
    const row = document.createElement('div');
    row.className = 'msg-bot-row';

    const isAudio = text.startsWith('audio:');
    const isVideo = text.startsWith('video:');
    const audioSrc = isAudio ? text.slice(6) : '';
    const videoId  = isVideo ? text.slice(6) : '';

    let bubbleClass = 'msg-bot-bubble';
    if (isVideo) bubbleClass += ' video-bubble';

    let innerHtml = '';
    if (isAudio) {
        innerHtml = createCustomAudioPlayer(audioSrc, time);
    } else if (isVideo) {
        innerHtml = `
            <div class="video-wrapper">
                <iframe
                    id="ifr_${videoId}"
                    src="https://scripts.converteai.net/abbfb8e9-1820-4d22-b6f1-31161a8ea891/players/${videoId}/v4/embed.html"
                    frameborder="0"
                    allowfullscreen
                    referrerpolicy="origin"
                    style="position:absolute;top:0;left:0;width:100%;height:100%;"
                ></iframe>
            </div>
            <p class="msg-time">${time}</p>`;
    } else {
        innerHtml = `<p class="msg-text">${escapeHtml(text)}</p><p class="msg-time">${time}</p>`;
    }

    row.innerHTML = `
        ${avatarImg('msg-avatar')}
        <div class="${bubbleClass}">
            ${innerHtml}
        </div>
    `;

    chatInner.appendChild(row);
    scrollToBottom();
}

// ===== USER MESSAGE =====
function appendUserMessage(text) {
    const time = getTime();
    const row = document.createElement('div');
    row.className = 'msg-user-row';
    row.innerHTML = `
        <div class="msg-user-bubble">
            <p class="msg-text">${escapeHtml(text)}</p>
            <div class="msg-user-meta">
                <p style="font-size:10px;color:var(--muted-foreground);">${time}</p>
                <svg style="width:0.875rem;height:0.875rem;color:var(--color-sky-500);flex-shrink:0;" viewBox="0 0 16 15" fill="currentColor">
                    <path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"/>
                </svg>
            </div>
        </div>
    `;
    chatInner.appendChild(row);
    scrollToBottom();
}

// ===== OPTION BUTTONS =====
function showOptions(options) {
    // Remove opções anteriores se existirem
    const prev = document.getElementById('options-area');
    if (prev) prev.remove();

    const area = document.createElement('div');
    area.className = 'options-area';
    area.id = 'options-area';

    options.forEach(opt => {
        const label = replaceVars(opt);
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = label;
        btn.addEventListener('click', () => handleOptionClick(label, area));
        area.appendChild(btn);
    });

    chatInner.appendChild(area);
    scrollToBottom();
}

function removeOptions() {
    const el = document.getElementById('options-area');
    if (el) el.remove();
}

// ===== CTA FINAL =====
let ctaShown = false;
async function showFinalCTA() {
    if (ctaShown) return;
    ctaShown = true;

    for (const msg of FINAL_MSGS) {
        await sleep(600);
        const isAudio = msg.startsWith('audio:');
        showTyping(isAudio);
        const delay = isAudio ? 2500 : 1800 + Math.min(msg.length * 55, 3000);
        await sleep(delay);
        removeTyping();
        statusText.textContent = 'online';
        appendBotMessage(msg);
        playMessageSound();
        await sleep(700);
    }

    // Área CTA
    const cta = document.createElement('div');
    cta.className = 'cta-area';
    cta.innerHTML = `
        <a href="${CTA_HREF}" target="_blank" rel="noopener noreferrer" class="cta-btn">
            QUERO PAGAR A TAXA
        </a>
    `;
    chatInner.appendChild(cta);
    
    // Dispara o evento InitiateCheckout
    if (typeof fbq === 'function') {
        fbq('track', 'InitiateCheckout');
    }

    // Scroll múltiplo para garantir
    scrollToBottom();
    setTimeout(scrollToBottom, 200);
    setTimeout(scrollToBottom, 600);
    setTimeout(scrollToBottom, 1200);
}

// ===== VIDEO TRACKING =====
let videoStartedAt = null;
function onVideoStarted() {
    if (videoStartedAt) return;
    videoStartedAt = Date.now();
    try { localStorage.setItem(LS_KEY_CTA_STARTED, String(videoStartedAt)); } catch(e) {}
}

function onVideoProgress(time) {
    onVideoStarted();
    if (time >= VIDEO_CTA_MS / 1000) {
        showFinalCTA();
    }
}

// Verificar se já tem timer salvo
(function checkSavedTimer() {
    try {
        const saved = Number(localStorage.getItem(LS_KEY_CTA_STARTED));
        if (Number.isFinite(saved) && saved > 0) {
            videoStartedAt = saved;
            const remaining = Math.max(0, saved + VIDEO_CTA_MS - Date.now());
            setTimeout(() => showFinalCTA(), remaining);
        }
    } catch(e) {}
})();

// Listener de mensagens do player
window.addEventListener('message', function(e) {
    const data = e.data;
    if (!data || data.mime !== 'smartplayer/message-text-v4') return;
    const id = VIDEO_ID;
    if (data.id !== id) return;

    if (data.type === 'videoPlay' || data.type === 'video:play') {
        onVideoStarted();
    }
    if (data.type === 'videoTimeUpdate' && typeof data?.payload?.time === 'number') {
        onVideoProgress(data.payload.time);
    }
});

// ===== ESCAPE HTML =====
function escapeHtml(str) {
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ===== CUSTOM AUDIO PLAYER JS =====
function generateWaveformHTML(isActive) {
    const heights = [30, 40, 60, 80, 50, 40, 30, 50, 70, 90, 100, 80, 60, 40, 30, 20, 30, 50, 70, 60, 40, 30, 20, 40, 60, 80, 70, 50, 30, 20, 40, 50, 30, 20];
    let html = '';
    const colorClass = isActive ? 'wave-bar active' : 'wave-bar bg';
    heights.forEach(h => {
        html += `<div class="${colorClass}" style="height: ${Math.max(12, h * 0.3)}px;"></div>`;
    });
    return html;
}

function createCustomAudioPlayer(audioUrl, time) {
    const id = 'audio-' + Math.random().toString(36).substr(2, 9);
    
    let durationStr = "0:15";
    if (audioUrl.includes('amanda-intro')) durationStr = "0:18";

    return `
    <div class="custom-audio-player">
        <button id="play-btn-${id}" class="audio-play-btn" onclick="toggleAudio('${id}')">
            <svg id="icon-play-${id}" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg>
            <svg id="icon-pause-${id}" viewBox="0 0 24 24" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div class="audio-waveform-container">
            <audio id="audio-el-${id}" preload="auto" src="${audioUrl}" ontimeupdate="updateAudioProgress('${id}')" onended="audioEnded('${id}')" onloadedmetadata="audioLoaded('${id}')"></audio>
            <div class="waveform-bg">
                <div class="waveform-bars-wrapper">
                    ${generateWaveformHTML(false)}
                </div>
            </div>
            <div id="waveform-active-${id}" class="waveform-active">
                <div class="waveform-bars-wrapper">
                    ${generateWaveformHTML(true)}
                </div>
            </div>
            <div id="progress-dot-${id}" class="progress-dot"></div>
            <input type="range" id="seek-${id}" min="0" max="100" value="0" class="audio-seek-input" oninput="seekAudio('${id}', this.value)" />
        </div>
    </div>
    <div class="audio-meta-row">
        <span id="duration-${id}" class="audio-duration" data-original="${durationStr}">${durationStr}</span>
        <span class="msg-time" style="margin-top:0;">${time}</span>
    </div>`;
}

window.toggleAudio = function(id) {
    const audio = document.getElementById('audio-el-' + id);
    const playIcon = document.getElementById('icon-play-' + id);
    const pauseIcon = document.getElementById('icon-pause-' + id);
    
    document.querySelectorAll('audio').forEach(a => {
        if(a.id !== 'audio-el-' + id && a.id.startsWith('audio-el-')) {
            a.pause();
            const otherId = a.id.replace('audio-el-', '');
            const otherPlay = document.getElementById('icon-play-' + otherId);
            const otherPause = document.getElementById('icon-pause-' + otherId);
            if (otherPlay) otherPlay.removeAttribute('hidden');
            if (otherPause) otherPause.setAttribute('hidden', '');
        }
    });

    if (audio.paused) {
        audio.play();
        playIcon.setAttribute('hidden', '');
        pauseIcon.removeAttribute('hidden');
    } else {
        audio.pause();
        playIcon.removeAttribute('hidden');
        pauseIcon.setAttribute('hidden', '');
        const durationText = document.getElementById('duration-' + id);
        if(durationText && durationText.dataset.original) {
            durationText.innerText = durationText.dataset.original;
        }
    }
};

window.updateAudioProgress = function(id) {
    const audio = document.getElementById('audio-el-' + id);
    const dot = document.getElementById('progress-dot-' + id);
    const activeWaveform = document.getElementById('waveform-active-' + id);
    const seek = document.getElementById('seek-' + id);
    const durationText = document.getElementById('duration-' + id);
    
    if (audio.duration && !audio.paused) {
        const progress = (audio.currentTime / audio.duration) * 100;
        dot.style.left = progress + '%';
        activeWaveform.style.width = progress + '%';
        seek.value = progress;
        
        const currentMins = Math.floor(audio.currentTime / 60);
        const currentSecs = Math.floor(audio.currentTime % 60);
        if(durationText) durationText.innerText = currentMins + ':' + (currentSecs < 10 ? '0' : '') + currentSecs;
    }
};

window.audioEnded = function(id) {
    const playIcon = document.getElementById('icon-play-' + id);
    const pauseIcon = document.getElementById('icon-pause-' + id);
    const dot = document.getElementById('progress-dot-' + id);
    const activeWaveform = document.getElementById('waveform-active-' + id);
    const seek = document.getElementById('seek-' + id);
    const durationText = document.getElementById('duration-' + id);
    
    if(playIcon) playIcon.removeAttribute('hidden');
    if(pauseIcon) pauseIcon.setAttribute('hidden', '');
    if(dot) dot.style.left = '0%';
    if(activeWaveform) activeWaveform.style.width = '0%';
    if(seek) seek.value = 0;
    
    if(durationText && durationText.dataset.original) {
        durationText.innerText = durationText.dataset.original;
    }
};

window.seekAudio = function(id, value) {
    const audio = document.getElementById('audio-el-' + id);
    if (audio.duration) {
        audio.currentTime = (value / 100) * audio.duration;
        updateAudioProgress(id);
    }
};

window.audioLoaded = function(id) {
    const audio = document.getElementById('audio-el-' + id);
    const durationText = document.getElementById('duration-' + id);
    if(audio.duration && audio.duration !== Infinity && durationText) {
        const mins = Math.floor(audio.duration / 60);
        const secs = Math.floor(audio.duration % 60);
        const formatted = mins + ':' + (secs < 10 ? '0' : '') + secs;
        durationText.dataset.original = formatted;
        if(audio.paused) {
            durationText.innerText = formatted;
        }
    }
};

// ===== HANDLE OPTION CLICK =====
async function handleOptionClick(label, area) {
    area.remove();
    appendUserMessage(label);
    scrollToBottom();
    currentStep++;
    await sleep(800);
    await playStep(currentStep);
}

// ===== PLAY STEP =====
let currentStep = 0;
let stepRunning = false;

async function playStep(stepIndex) {
    const step = STEPS[stepIndex];
    if (!step) return;

    stepRunning = true;

    for (const rawMsg of step.bot) {
        if (!stepRunning) return;

        const isAudio = rawMsg.startsWith('audio:');
        const isVideo = rawMsg.startsWith('video:');
        const text = isAudio || isVideo ? rawMsg : replaceVars(rawMsg);

        // Pré-delay (600ms do original)
        await sleep(600);

        // Mostrar typing
        showTyping(isAudio ? true : false);

        // Delay de typing
        let typingDelay;
        if (isAudio) {
            typingDelay = 2200;
        } else if (isVideo) {
            typingDelay = 1200;
        } else {
            typingDelay = 1800 + Math.min(text.length * 55, 3500);
        }
        await sleep(typingDelay);

        if (!stepRunning) return;

        // Remover typing e mostrar mensagem
        removeTyping();
        statusText.textContent = 'online';
        appendBotMessage(text);

        // Som de mensagem (exceto áudio)
        if (!isAudio) {
            playMessageSound();
        }

        // Pós-delay: áudios de intro esperam 10s, outros 700ms
        let postDelay;
        if (rawMsg === 'audio:sounds/julia-intro.mp3' || rawMsg === 'audio:sounds/amanda-intro.mp3') {
            postDelay = 10000;
        } else {
            postDelay = 700;
        }
        await sleep(postDelay);
    }

    // Mostrar opções ou video
    if (step.options) {
        showOptions(step.options);
    }
    // (o video já foi renderizado como mensagem de bot)
}

// ===== INICIAR =====
setTimeout(() => {
    playStep(0);
}, 1000);

</script>
